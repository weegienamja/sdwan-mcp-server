[project]
name = "cisco-vmanage-mcp"
version = "2.2.0"
description = "MCP server exposing Cisco SD-WAN vManage APIs for LLM agents with correlation, root-cause analysis, and operational guardrails"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Jamie Blair", email = "jamie@jamieblair.co.uk" }
]
keywords = ["cisco", "sd-wan", "vmanage", "mcp", "ai-agents", "defenseclaw"]
dependencies = [
    "mcp[cli]>=1.28.1,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.3.3,<9.0.0",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "uvicorn>=0.42.0",
]

[project.scripts]
cisco-vmanage-mcp = "cisco_vmanage_mcp.server:main"
vmanage-mcp = "cisco_vmanage_mcp.cli:cli"
vmanage-mcp-install = "cisco_vmanage_mcp.installer:main"
vmanage-console = "cisco_vmanage_mcp.app:main"
vmanage-web = "cisco_vmanage_mcp.webapp:main"

# Note: When running with python -m, use 'python -m cisco_vmanage_mcp'
# (not 'python -m cisco_vmanage_mcp.server') to avoid duplicate module loading.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "keyring>=25.7.0",
]
claude = ["anthropic>=0.40.0", "keyring>=25.7.0"]
openai = ["openai>=1.50.0", "keyring>=25.7.0"]
gemini = ["google-genai>=1.0.0", "keyring>=25.7.0"]
observability = [
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
]
marketplace = [
    "ide-telemetry-mcp-sdk @ git+https://wwwin-github.cisco.com/cisco-vscode/ide-telemetry-mcp-sdk.git@101cbd54c6a6888a0f4bf582efc65712dcf4d8a3 ; python_version >= '3.12'",
]
dev = [
    "bandit[toml]>=1.8.0",
    "build>=1.2.0",
    "httpx2>=2.12.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pyyaml>=6.0",
    "ruff>=0.9.0",
    "twine>=6.0.0",
    "commitizen>=3.0",
]

[tool.hatch.build.targets.wheel.force-include]
"certs/ca-bundle.pem" = "cisco_vmanage_mcp/certs/ca-bundle.pem"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]
"src/cisco_vmanage_mcp/server.py" = ["E402"]

[tool.pyright]
include = ["src", "tests", "scripts/live_readonly_audit.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["cisco_vmanage_mcp"]
omit = [
    "*/ai_providers.py",
    "*/app.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.2.0"
version_files = [
    "src/cisco_vmanage_mcp/__init__.py:__version__",
    "pyproject.toml:version",
]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
