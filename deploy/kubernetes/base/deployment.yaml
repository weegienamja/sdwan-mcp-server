apiVersion: apps/v1
kind: Deployment
metadata:
  name: cisco-vmanage-mcp
  labels:
    app.kubernetes.io/name: cisco-vmanage-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cisco-vmanage-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cisco-vmanage-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: registry.example.com/cisco-vmanage-mcp:2.2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cisco-vmanage-mcp-config
            - secretRef:
                name: cisco-vmanage-mcp-secrets
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsUser: 10001
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /var/lib/cisco-vmanage-mcp
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: cisco-vmanage-mcp-state
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi