apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cisco-vmanage-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cisco-vmanage-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              cisco-vmanage-mcp/identity-proxy: "true"
      ports:
        - port: 8765
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - port: 443
          protocol: TCP